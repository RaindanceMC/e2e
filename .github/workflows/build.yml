name: Build

# Every push and pull request builds and tests this repository — only this one, so it takes a few minutes. A push to
# master also publishes every module and plugin version that is not in packages.tstieh.de yet.
# The end-to-end scenarios (a real Paper server and bots) run only when asked: Actions → Build → Run workflow.

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Also play the end-to-end scenarios on a real Paper server with bots
        type: boolean
        default: false
      tests:
        description: Which scenarios (a surefire -Dtest pattern; empty for all)
        type: string
        default: ''

permissions:
  contents: read

env:
  REPOSILITE_USERNAME: ${{ vars.REPOSILITE_USERNAME }}
  REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
  # Reposilite's TLS termination trips a TLSv1.3/SNI handshake bug in Maven's HTTP transport — pin TLSv1.2.
  MAVEN_OPTS: -Djdk.tls.client.protocols=TLSv1.2

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # 25: paper-api 26.x ships Java 25 class files; an older JDK fails while resolving, not compiling.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: packages-releases
          server-username: REPOSILITE_USERNAME
          server-password: REPOSILITE_PASSWORD

      - name: Credentials for the snapshots repository
        run: |
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server><id>packages-releases</id><username>${env.REPOSILITE_USERNAME}</username><password>${env.REPOSILITE_PASSWORD}</password></server>
              <server><id>packages-snapshots</id><username>${env.REPOSILITE_USERNAME}</username><password>${env.REPOSILITE_PASSWORD}</password></server>
            </servers>
          </settings>
          XML

      # What modules-api's EveryModuleKeepsTheContractTest checked across the monorepo, now per repository: a module
      # that ships wording is held to WordingContract — absent, a player once read "rainshome</white> is set, here."
      - name: Every module with wording keeps the wording contract
        run: |
          set -euo pipefail
          for module in */; do
            module="${module%/}"
            [ -d "$module/src/main/resources" ] || continue
            if find "$module/src/main/resources" -name messages.yml | grep -q . &&                ! grep -rqs "implements WordingContract" "$module/src/test"; then
              echo "::error::$module ships messages.yml but nothing implements WordingContract for it"; exit 1
            fi
          done

      # install, not verify: a plugin shades its module out of the local repository, and StandaloneJarTest checks
      # that what ended up in the jar is what was just compiled.
      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress -U -T 1C install

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 7

      # Releases are immutable in the registry, so a version is published exactly once: whatever is not there yet.
      - name: Publish new versions to packages.tstieh.de
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          todo=""
          for module in ; do
            if [ "$module" = . ]; then flags="-N"; else flags="-pl $module"; fi
            artifact=$(mvn -B -q $flags help:evaluate -Dexpression=project.artifactId -DforceStdout)
            version=$(mvn -B -q $flags help:evaluate -Dexpression=project.version -DforceStdout)
            url="https://packages.tstieh.de/releases/de/raindancer/modules/$artifact/$version/$artifact-$version.pom"
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "$REPOSILITE_USERNAME:$REPOSILITE_PASSWORD" "$url")
            echo "$artifact $version: $code"
            if [ "$code" = 404 ]; then todo="$todo $module"; fi
          done
          for module in $todo; do
            if [ "$module" = . ]; then
              mvn --batch-mode --no-transfer-progress -N -DskipTests deploy
            else
              mvn --batch-mode --no-transfer-progress -pl "$module" -DskipTests deploy
            fi
          done

  # ── on request only ─────────────────────────────────────────────────────────────────────────────────────
  e2e:
    name: End-to-end (real server, bots)
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RAINS_E2E_CACHE: ${{ github.workspace }}/.e2e-cache
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # 25: paper-api 26.x ships Java 25 class files; an older JDK fails while resolving, not compiling.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: packages-releases
          server-username: REPOSILITE_USERNAME
          server-password: REPOSILITE_PASSWORD

      - name: Credentials for the snapshots repository
        run: |
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server><id>packages-releases</id><username>${env.REPOSILITE_USERNAME}</username><password>${env.REPOSILITE_PASSWORD}</password></server>
              <server><id>packages-snapshots</id><username>${env.REPOSILITE_USERNAME}</username><password>${env.REPOSILITE_PASSWORD}</password></server>
            </servers>
          </settings>
          XML

      # Paper, the vanilla server and client jars and the game's assets: fetched once, then cached.
      - name: Cache what the game needs
        uses: actions/cache@v4
        with:
          path: .e2e-cache
          key: rains-e2e-v1

      - name: Build
        run: mvn --batch-mode --no-transfer-progress -U -T 1C install -DskipTests

      - name: Every plugin, from the registry
        run: |
          set -euo pipefail
          JARS=jars
          # A plugin of another repository, the newest version in the registry, under the directory and name the
          # scenarios look for it by: <dir>/target/<PluginName>-<version>.jar.
          fetch() {
            artifact="$1"; name="$2"
            meta="https://packages.tstieh.de/releases/de/raindancer/modules/$artifact/maven-metadata.xml"
            version=$(curl -s -u "$REPOSILITE_USERNAME:$REPOSILITE_PASSWORD" "$meta" | grep -oPm1 '(?<=<release>)[^<]+')
            mkdir -p "$JARS/$artifact/target"
            curl -sf -u "$REPOSILITE_USERNAME:$REPOSILITE_PASSWORD" -o "$JARS/$artifact/target/$name-$version.jar" \
              "https://packages.tstieh.de/releases/de/raindancer/modules/$artifact/$version/$artifact-$version.jar"
            echo "$artifact → $name $version"
          }

          fetch claims-standalone RainsExtendedClaims
          fetch moderation-standalone RainsModeration
          fetch names-standalone RainsColouredNames
          fetch cosmetics-standalone RainsCosmetics
          fetch warp-standalone RainsWarps
          fetch homes-standalone RainsHomes
          fetch tpa-standalone RainsTPA
          fetch essentials-standalone RainsEssentials
          fetch chat-standalone RainsChat
          fetch farmworld-standalone RainsFarmWorlds
          fetch pack-standalone RainsServerPack
          fetch rtp-standalone RainsRandomTeleport
          fetch mannequin-standalone RainsMannequins
          fetch worldgate-standalone RainsWorldGate
          fetch invsnap-standalone RainsInventorySnapshots
          fetch xpbottle-standalone RainsXPBottles
          fetch sends-standalone RainsSends
          fetch oneblock-standalone RainsOneBlock
          fetch twitch-standalone RainsTwitch
          fetch arenagate-standalone RainsArenaGate
          fetch veintoggle-standalone RainsVeinToggle
          fetch healthbars-standalone RainsHealthBars
          fetch ctf-standalone RainsCaptureTheFlag
          fetch enchants-standalone RainsEnchants
          fetch performance-standalone RainsPerformanceOptimizer
          fetch economy-standalone RainsEconomy
          fetch shops-standalone RainsShops
          fetch roles-standalone RainsRoles
          fetch ranks-standalone RainsRanks
          fetch jobs-standalone RainsJobs
          fetch guilds-standalone RainsGuilds
          fetch playerutils-standalone RainsPlayerUtils
          fetch voicebridge-standalone RainsVoiceBridge
          fetch xaeromap-standalone RainsXaeroMap
          fetch wallsroads-standalone RainsWallsAndRoads
          fetch chained-standalone RainsChained
          fetch arena-standalone RainsArena
          fetch worldutils-bundle RainsWorldUtils
          fetch speedrun-standalone RainsSpeedrun
          fetch dnd-standalone RainsAdventurers
          fetch network-proxy RainsNetworkProxy
          fetch speedrun-bundle RainsSpeedrunServer
          fetch yeuksmp YeukSMP

      - name: RainsCore, from the registry
        run: |
          core=$(mvn -B -q help:evaluate -Dexpression=rainscore.version -DforceStdout)
          mvn -B -ntp dependency:get -Dartifact=de.raindancer:RainsCore:$core

      - name: Play the scenarios
        run: >-
          mvn --batch-mode --no-transfer-progress -Pe2e test -pl modules-e2e
          ${{ inputs.tests != '' && format('-Dtest={0} -Dsurefire.failIfNoSpecifiedTests=false', inputs.tests) || '' }}

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.sha }}
          path: |
            modules-e2e/target/e2e/
            modules-e2e/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
